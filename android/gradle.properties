org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC
android.useAndroidX=true

# --warning-mode=(all,fail,none,summary)
org.gradle.warning.mode=summary
ksp.incremental.log=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# NOTE (aves-miuix, P0 本地构建环境): on this Windows machine the Kotlin incremental
# compilation caches of plugin modules cannot be closed ("Could not close incremental
# caches in .../caches-jvm/jvm/kotlin"), which fails `:device_info_plus:compileDebugKotlin`.
# Disabling incremental Kotlin compilation works around it. Revisit if upstream/AGP fixes it.
kotlin.incremental=false

# cf https://developer.android.com/topic/performance/app-optimization/full-mode
android.enableR8.fullMode=true

# optimized resource shrinking pipeline (enabled by default with AGP >= 9.0.0)
android.r8.optimizedResourceShrinking=true

# enable parallelization
org.gradle.parallel=true
org.gradle.workers.max=2

# most tasks are incompatible with configuration cache as of Gradle v8.14.4
org.gradle.configuration-cache=false
org.gradle.configuration-cache.parallel=true

# cf https://github.com/flutter/flutter/issues/180137
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
